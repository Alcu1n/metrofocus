<symbol id="battery" viewBox="0 0 23 16"><rect x="1" y="3" width="18" height="10" rx="2" stroke="currentColor" fill="none"/><rect x="3" y="5" width="14" height="6" rx="1" fill="currentColor"/><path d="M21 6v4" stroke="currentColor" stroke-width="2"/></symbol>
</defs></svg>
<header class="review-head">
<div class="review-kicker">METROFOCUS / DESIGN TOURNAMENT / V1</div>
<h1 class="review-title">三种发车方式，同一程专注。</h1>
<p class="review-intro">先比较车站首页和它的核心组件。三案保留夜行地铁、四条任务线路与既有班次规则，只改变信息组织和视觉表达。<b>这是浏览器视觉原型，尚未应用到 SwiftUI。</b></p>
<div class="review-tools">
<button data-view="compare" aria-pressed="true">三案并排</button><button data-view="single" aria-pressed="false">单案细看</button><span class="tool-divider"></span>
<select id="language" aria-label="界面语言"><option value="zh">简体中文</option><option value="en">English</option></select>
<button id="long-task">长任务示例</button><button id="empty-task">空任务状态</button><button id="reset">重置内容</button><button id="references">视觉参考</button>
</div>
<p class="review-state" id="state"></p><div id="selection-feedback" class="selection-feedback" aria-live="polite"></div>
</header>
<main class="board" id="board"></main>
<nav class="switcher" aria-label="方案切换"><button id="previous" aria-label="上一个方案"><svg><use href="#back"/></svg></button><div class="switcher-label"><small>UI CONCEPT</small><span id="current-variant">A · 站台导视</span></div><button id="next" aria-label="下一个方案"><svg><use href="#arrow"/></svg></button><button class="all" id="switch-all">并排</button></nav>
<dialog id="global-dialog" class="global-dialog"></dialog>
<script>
// PROTOTYPE ONLY: three renderings of the same station, in-memory fixtures.
const $=s=>document.querySelector(s); const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const words={zh:{station:'车站',atlas:'路网',tickets:'票夹',settings:'设置',headline:'下一站，心无旁骛。',origin:'始发站 · 此刻',now:'此刻',total:'累计',task:'这一程，想完成什么？',placeholder:'想专注完成什么？',services:'选择班次',edit:'编排',min:'分钟',depart:'检票发车',prepare:'含 30 秒候车准备',focus:'专注',rest:'换乘休息',none:'直达，不换乘',line:'任务线路',to:'下一站',pass:'个人通行凭证',unissued:'尚未发车',ready:'准备出发',done:'完成',close:'关闭',error:'先写下这次想完成的事。',short:'微步短驳',standard:'经典通勤',express:'特快直达',custom:'跨城专线',safe:'等待、休息不计入专注',boarding:'候车准备',return:'返回车站',sound:'声景',metro:'地下铁',audio:'声景播放',haptic:'操作触感'},en:{station:'Station',atlas:'Atlas',tickets:'Tickets',settings:'Settings',headline:'Next stop. A clearer mind.',origin:'DEPARTURE · NOW',now:'Here & now',total:'TOTAL',task:'WHAT WILL YOU FINISH?',placeholder:'What are you working on?',services:'Choose your service',edit:'Edit route',min:'min',depart:'All aboard',prepare:'Includes 30-second boarding',focus:'focus',rest:'transfer break',none:'Direct. No transfer.',line:'Task line',to:'NEXT STOP',pass:'PERSONAL TRANSIT PASS',unissued:'NOT YET BOARDED',ready:'Ready to depart',done:'Done',close:'Close',error:'Add something you want to finish first.',short:'Shuttle',standard:'Standard',express:'Express',custom:'Custom',safe:'Waiting and breaks never count as focus',boarding:'Boarding soon',return:'Back to station',sound:'Soundscape',metro:'Underground',audio:'Soundscape playback',haptic:'Haptic feedback'}};
const lines=[{zh:'写作',en:'Writing',sub:['让想法抵达纸面','Bring ideas to life'],color:'#ff4685'},{zh:'代码',en:'Coding',sub:['留白，给深度思考','Make space for deep work'],color:'#64d89a'},{zh:'阅读',en:'Reading',sub:['驶入另一个世界','Travel into another world'],color:'#e8c45f'},{zh:'生活',en:'Life',sub:['小事，也值得一趟旅程','Small things deserve a journey'],color:'#85c9f1'}];
const services=[{key:'short',code:'LOCAL',min:15,count:1,rest:0},{key:'standard',code:'COMMUTER',min:25,count:4,rest:5},{key:'express',code:'EXPRESS',min:50,count:2,rest:10}];
const info={A:{title:'站台导视',english:'PLATFORM',strength:'线路成为阅读动线',cost:'熟悉的横向班次卡，保留交通感；比 B 占用更多图形空间。'},B:{title:'发车时刻表',english:'TIMETABLE',strength:'更快比较与开始',cost:'任务输入与班次参数最清楚；装饰更少，纸票感留给到站。'},C:{title:'随身通行证',english:'BOARDING PASS',strength:'出发与到站形成呼应',cost:'编辑过程像填写通行证；浅色票面存在感更强，安静程度略低。'}};
const params=new URLSearchParams(location.search);let variant=['A','B','C'].includes(params.get('variant'))?params.get('variant'):'A';let mode=params.get('view')==='single'?'single':'compare';const capture=params.has('capture');if(capture)mode='single';
const state={lang:params.get('lang')==='en'?'en':'zh',task:params.get('lang')==='en'?'Finish chapter one':'写完第一章',line:0,service:0,custom:null,error:false,sound:true,haptic:true};
const t=k=>words[state.lang][k];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const service=()=>state.service===3?state.custom:services[state.service];
function summary(){let s=service();return state.lang==='zh'?`${s.count} 段旅程 · ${s.min*s.count} 分钟专注`:`${s.count} ${s.count===1?'stop':'stops'} · ${s.min*s.count} min of focus`}
function restText(s=service()){return s.count===1?t('none'):state.lang==='zh'?`${s.rest} 分钟换乘休息`:`${s.rest}-min transfer breaks`}
function lineName(){return state.lang==='zh'?`${lines[state.line].zh}线`:lines[state.line].en}
function lineButtons(){return `<div class="line-selector" role="group" aria-label="${t('line')}">${lines.map((l,i)=>`<button class="line-option" data-line="${i}" aria-pressed="${state.line===i}" style="--line:${l.color}"><span class="line-dot"></span>${l[state.lang]}</button>`).join('')}</div>`}
function field(){return `<div class="task-label">${t('task')}</div><div class="task-field"><input aria-label="${t('task')}" data-task maxlength="24" value="${esc(state.task)}" placeholder="${t('placeholder')}">${icon('edit')}</div><p class="task-error ${state.error?'show':''}">${t('error')}</p>`}
function section(){return `<div class="section-head"><h3>${t('services')}</h3><button class="text-button" data-action="route">${icon('sliders')}${t('edit')}</button></div>`}
function serviceCards(type){return `<div class="${type==='ticket'?'ticket-services':'services'}">${services.map((s,i)=>type==='ticket'?`<button class="ticket-service" data-service="${i}" aria-pressed="${state.service===i}" aria-label="${t(s.key)}, ${s.min} ${t('min')}, ${s.count}"><strong class="mono">${s.min}</strong><em>${t('min')}</em><span>${t(s.key)} <small>×${s.count}</small></span></button>`:`<button class="service" data-service="${i}" aria-pressed="${state.service===i}" aria-label="${t(s.key)}, ${s.min} ${t('min')}, ${s.count}"><div class="service-code mono">${s.code}${state.service===i?icon('check'):''}</div><div class="service-num">${s.min}</div><div class="service-units"><span>${t('min')}</span><span>×${s.count}</span></div><div class="service-name">${t(s.key)}</div></button>`).join('')}</div>`}
function commonHeader(){return `<div class="statusbar"><span>9:41</span><div class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</div></div><div class="nav"><div class="brand">${icon('mark')}<span>METROFOCUS</span></div><button class="icon-button" data-action="settings" aria-label="${t('settings')}">${icon('sliders')}</button></div>`}
function footer(){return `<footer class="departure"><div class="departure-top"><strong data-summary>${summary()}</strong><span>${t('prepare').replace('含 ','').replace('Includes ','')}</span></div><button class="depart" data-action="depart">${icon('ticket')}<span>${t('depart')}</span>${icon('arrow')}</button></footer><nav class="tabbar" aria-label="App navigation"><button class="tab active" aria-current="page" data-action="station">${icon('train')}${t('station')}</button><button class="tab" data-action="atlas">${icon('network')}${t('atlas')}</button><button class="tab" data-action="tickets">${icon('ticket')}${t('tickets')}</button><span class="home-indicator"></span></nav>`}
function VariantA(){return `<div class="meta"><span><i class="dot"></i>${t('origin')}</span><span>${t('total')} 0 min</span></div><h1>${t('headline')}</h1><p class="subtitle">${lines[state.line].sub[state.lang==='zh'?0:1]}</p><div class="a-route"><div class="a-route-top"><div class="line-badge"><span class="line-number">0${state.line+1}</span><span>${lineName()}</span></div><small class="mono">${service().code}</small></div><svg class="route-graphic" viewBox="0 0 356 65" aria-label="从此刻出发的线路示意图"><path d="M-15 58H86Q119 58 145 42L192 14Q207 4 231 4H373" fill="none" stroke="#2a363a" stroke-width="7"/><path d="M18 52H87Q110 52 130 42L195 22Q215 14 239 14H337" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/><circle cx="20" cy="52" r="8" fill="var(--bg)" stroke="var(--ink)" stroke-width="4"/><circle cx="332" cy="14" r="9" fill="var(--bg)" stroke="var(--accent)" stroke-width="4"/><g transform="translate(100 20)"><rect x="-1" y="-2" width="35" height="42" rx="11" fill="#060a0b"/><rect x="4" y="1" width="25" height="35" rx="8" fill="#eceee6"/><rect x="10" y="6" width="13" height="3" rx="1.5" fill="var(--accent)"/><rect x="8" y="13" width="17" height="11" rx="3" fill="#0a1013"/><circle cx="11" cy="29" r="2" fill="#0a1013"/><circle cx="22" cy="29" r="2" fill="#0a1013"/></g></svg><div class="route-endpoints"><span>${t('now')}</span><span class="accent">${t('to')}</span></div><div class="task-area">${field()}</div></div>${lineButtons()}${section()}${serviceCards()}<div class="focus-plan">${icon('clock')}<span>${restText()}</span></div>`}
function VariantB(){return `<div class="b-title"><div><h1>${t('headline')}</h1><p class="subtitle">${lines[state.line].sub[state.lang==='zh'?0:1]}</p></div><div class="b-ordinal mono">0${state.line+1}</div></div><div class="b-task">${field()}</div>${lineButtons()}${section()}<div class="timetable">${services.map((s,i)=>`<button class="time-row" data-service="${i}" aria-pressed="${state.service===i}"><div class="time-duration"><b>${s.min}</b><small>${t('min')}</small></div><div><h4>${t(s.key)}</h4><p>${state.lang==='zh'?`${s.count} 段 · ${s.min*s.count} 分钟专注`:`${s.count} ${s.count===1?'stop':'stops'} · ${s.min*s.count} min focus`}</p></div><span class="row-radio">${icon('check')}</span></button>`).join('')}</div><div class="b-total"><span>${t('origin')}</span><span>${t('total')} 0 min</span></div><div class="focus-plan">${icon('clock')}<span>${restText()}</span></div>`}
function VariantC(){return `<h1>${t('headline')}</h1><p class="subtitle">${lines[state.line].sub[state.lang==='zh'?0:1]}</p>${lineButtons()}<div class="ticket-form"><div class="ticket-meta"><span>${t('pass')}</span><span>MF / 001</span></div><div class="ticket-origin"><div class="ticket-line"><span class="line-number">0${state.line+1}</span>${lineName()}</div><span>·</span><span>${t('now')}</span>${icon('arrow')}</div>${field()}${section()}${serviceCards('ticket')}<div class="ticket-tail"><div><strong>${t(service().key)}</strong><p>${state.lang==='zh'?`${service().min} 分钟 × ${service().count} 段`:`${service().min} min × ${service().count} ${service().count===1?'stop':'stops'}`}</p></div><div class="ticket-seal">${t('unissued')}<br>READY WHEN YOU ARE</div></div></div><div class="c-note"><span>${t('origin')}</span><span>${t('total')} 0 min</span></div><div class="focus-plan">${icon('clock')}<span>${restText()}</span></div>`}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';$('#language').value=state.lang;document.body.classList.toggle('single',mode==='single');document.body.classList.toggle('capture',capture);const scrolls={};document.querySelectorAll('.phone').forEach(p=>scrolls[p.dataset.variant]=p.querySelector('.screen').scrollTop);$('#board').innerHTML=Object.entries(info).map(([key,item])=>`<article class="entry ${key===variant?'focused':''}" data-entry="${key}"><header class="entry-head"><h2>${key} · ${item.title}</h2><span>${item.english}</span></header><section class="phone variant-${key.toLowerCase()}" data-variant="${key}" aria-label="方案 ${key} ${item.title}" style="--accent:${lines[state.line].color};--soft:${lines[state.line].color}18">${commonHeader()}<div class="screen">${({A:VariantA,B:VariantB,C:VariantC})[key]()}</div>${footer()}</section><div class="entry-note"><strong>${item.strength}</strong>${item.cost}<br><button class="select-direction" data-choose="${key}">暂选 ${key} · ${item.title}</button></div></article>`).join('');document.querySelectorAll('.phone').forEach(p=>p.querySelector('.screen').scrollTop=scrolls[p.dataset.variant]||0);$('#current-variant').textContent=`${variant} · ${info[variant].title}`;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===mode));updateState()}
function updateState(){$('#state').textContent=`共同样例：${state.task||'未填写任务'} / ${lineName()} / ${summary()}。更改内容会同步到三案；全部操作仅在原型内生效。`}
function switchVariant(key){variant=key;mode='single';const q=new URLSearchParams(location.search);q.set('variant',variant);q.set('view','single');history.replaceState({},'',`${location.pathname}?${q}`);render()}
function showSheet(phone,kind){phone.querySelector('.sheet-layer')?.remove();let content='';if(kind==='route'){let s=service();content=`<h3>${t('edit')}</h3></div><p>${state.lang==='zh'?'调整这一程的区间和站点。':'Set the intervals for this journey.'}</p><label class="field">${t('focus')}<input id="custom-min" type="number" min="5" max="120" value="${s.min}" aria-label="Focus minutes"></label><label class="field">${t('rest')}<input id="custom-rest" type="number" min="1" max="30" value="${Math.max(1,s.rest)}" aria-label="Rest minutes"></label><label class="field">${state.lang==='zh'?'区间数':'Stops'}<input id="custom-count" type="number" min="1" max="8" value="${s.count}" aria-label="Segments"></label><button class="sheet-action" data-action="save-route">${t('done')}</button>`}else if(kind==='settings'){content=`<h3>${t('settings')}</h3></div><dl><div><dt>${t('sound')}</dt><dd>${t('metro')}</dd></div></dl><label class="field">${t('audio')}<input data-setting="sound" type="checkbox" ${state.sound?'checked':''}></label><label class="field">${t('haptic')}<input data-setting="haptic" type="checkbox" ${state.haptic?'checked':''}></label><p>${state.lang==='zh'?'声景与触感可分别关闭。':'Sound and haptics can be disabled independently.'}</p><button class="sheet-action" data-action="close-sheet">${t('done')}</button>`}else{content=`<h3>${t('boarding')}</h3></div><p class="preview-time mono">00:30</p><p>${esc(state.task)}</p><dl><div><dt>${lineName()}</dt><dd>${t(service().key)}</dd></div><div><dt>${t('focus')}</dt><dd>${service().min*service().count} ${t('min')}</dd></div></dl><button class="sheet-action" data-action="close-sheet">${t('return')}</button><p class="preview-badge">${state.lang==='zh'?'交互预览 · 不会启动实际计时或保存记录':'INTERACTION PREVIEW · NO TIMER OR RECORD CREATED'}</p>`}const layer=document.createElement('div');layer.className='sheet-layer';layer.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${kind}"><div class="handle"></div><div class="sheet-header"><button class="text-button" data-action="close-sheet">${t('close')}</button>${content}</section>`;phone.append(layer);layer._trigger=document.activeElement;layer.addEventListener('click',e=>{if(e.target===layer)closeSheet(layer)});layer.querySelector('button').focus()}
function closeSheet(layer){const trigger=layer._trigger;layer.remove();if(trigger?.isConnected)trigger.focus()}
function modal(title,body){const d=$('#global-dialog');d.innerHTML=`<header><h3>${title}</h3><button aria-label="关闭" onclick="this.closest('dialog').close()">关闭</button></header>${body}`;d.showModal()}
function references(){modal('沿用品牌，探索三种信息组织',`<p>下列是本轮原创视觉样张。借鉴交通导视、发车时刻表和纸质通行证的组织原则；没有引用外部品牌或付费字体。当前版本的真实 SwiftUI 截图可在下方打开。</p><div class="reference-grid"><article><div class="reference-sample ref-a">下一站<br>心无旁骛<svg viewBox="0 0 200 60"><path d="M0 48h70q15 0 30-13l18-13q14-12 35-12h47" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="10" cy="48" r="7" fill="#0a0e11" stroke="currentColor" stroke-width="3"/></svg></div><h4>A · 站台导视</h4><p>借鉴：大字号目的地、路径引导、明确线路色。图形只表达从哪里开始。</p></article><article><div class="reference-sample ref-b"><div class="ref-row"><b>15</b>微步短驳<span>01</span></div><div class="ref-row"><b>25</b>经典通勤<span>04</span></div><div class="ref-row"><b>50</b>特快直达<span>02</span></div></div><h4>B · 发车时刻表</h4><p>借鉴：统一对齐、比较式阅读、行与行的节奏。让信息完成视觉表达。</p></article><article><div class="reference-sample ref-c"><small>PERSONAL TRANSIT PASS</small><br><strong>写完第一章</strong><div class="tear"></div><span class="seal">尚未发车 / READY</span></div><h4>C · 随身通行证</h4><p>借鉴：票面字段、撕线分区、纸张与墨色的反差。尚未发车的票面不会显示完成印章。</p></article></div><p><button id="current-reference">查看当前车站截图</button> · 系统字体与手绘几何图标；无需下载字体。</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const phone=b.closest('.phone');if(b.dataset.line!==undefined){state.line=Number(b.dataset.line);render()}else if(b.dataset.service!==undefined){state.service=Number(b.dataset.service);render()}else if(b.dataset.choose){$('#selection-feedback').textContent=`已标记 ${b.dataset.choose} · ${info[b.dataset.choose].title}。请在对话中告诉我你的选择，也可以指定混搭。`}else if(b.dataset.view){mode=b.dataset.view;render()}else if(b.dataset.action){const a=b.dataset.action;if(a==='close-sheet')closeSheet(b.closest('.sheet-layer'));else if(a==='depart'){if(!state.task.trim()){state.error=true;render();document.querySelector(`[data-variant="${phone.dataset.variant}"] input[data-task]`).focus()}else showSheet(phone,'depart')}else if(a==='route'||a==='settings')showSheet(phone,a);else if(a==='save-route'){const layer=b.closest('.sheet');state.custom={key:'custom',code:'CUSTOM',min:Math.min(120,Math.max(5,Number(layer.querySelector('#custom-min').value)||5)),rest:Math.min(30,Math.max(1,Number(layer.querySelector('#custom-rest').value)||1)),count:Math.min(8,Math.max(1,Number(layer.querySelector('#custom-count').value)||1))};state.service=3;render()}else if(a==='atlas'||a==='tickets'){modal(`当前${a==='atlas'?'路网':'票夹'} · 上一版原生截图`, `<p>作为已有 App 的上下文参考，本轮没有重新设计此页。</p><img alt="当前${a==='atlas'?'路网':'票夹'}截图" src="reference/current-${a}.png">`)}else if(a==='station'){phone.querySelector('.screen').scrollTo({top:0,behavior:'smooth'})}}else if(b.id==='previous'){switchVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+2)%3])}else if(b.id==='next'){switchVariant(['A','B','C'][(['A','B','C'].indexOf(variant)+1)%3])}else if(b.id==='switch-all'){mode='compare';render()}else if(b.id==='references'){references()}else if(b.id==='current-reference'){modal('当前车站 · 原生截图',`<img alt="当前 SwiftUI 车站" src="reference/current-station.png">`)}else if(b.id==='long-task'){state.task=state.lang==='zh'?'完成产品设计说明并整理下一轮迭代计划':'Finish one small thing';state.error=false;render()}else if(b.id==='empty-task'){state.task='';state.error=false;render()}else if(b.id==='reset'){Object.assign(state,{task:state.lang==='zh'?'写完第一章':'Finish chapter one',line:0,service:0,custom:null,error:false,sound:true,haptic:true});render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-task]')){state.task=e.target.value;state.error=false;document.querySelectorAll('[data-task]').forEach(input=>{if(input!==e.target)input.value=state.task});document.querySelectorAll('.task-error').forEach(n=>n.classList.remove('show'));updateState()}});
document.addEventListener('change',e=>{if(e.target.id==='language'){state.lang=e.target.value;state.task=state.lang==='zh'?'写完第一章':'Finish chapter one';state.error=false;render()}else if(e.target.dataset.setting){state[e.target.dataset.setting]=e.target.checked}});
document.addEventListener('keydown',e=>{const layer=document.querySelector('.sheet-layer');if(layer){if(e.key==='Escape'){e.preventDefault();closeSheet(layer);return}if(e.key==='Tab'){const focusable=[...layer.querySelectorAll('button,input')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable||$('#global-dialog').open)return;if(e.key==='ArrowLeft')$('#previous').click();if(e.key==='ArrowRight')$('#next').click()});
render();
</script>
</body>
